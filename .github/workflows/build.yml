name: Build GBA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          apt-get update
          apt-get install -y git python3 python-is-python3
      - name: Baixar Butano
        run: git clone --depth 1 https://github.com/GValiente/butano.git /butano
      - name: Montar projeto
        run: |
          cd /butano/template
          mkdir -p src graphics
          rm -rf src/* graphics/* include/*
          cp $GITHUB_WORKSPACE/main.cpp src/
          cp $GITHUB_WORKSPACE/*.bmp $GITHUB_WORKSPACE/*.json graphics/
      - name: Compilar
        run: |
          cd /butano/template
          make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: etruria-gba
          path: /butano/template/*.gba
